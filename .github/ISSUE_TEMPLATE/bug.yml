name: Bug report
description: Reproduce a problem with fictional data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic records. Never attach a personal backup, private notes or credentials. Report security issues privately using SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Smallest reproduction
      description: Include app version, browser or skill host, and steps using fictional data.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public material
      options:
        - label: My reproduction and attachments contain only synthetic data.
          required: true
